version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-local
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    # Loopback only: the sites reach it over the compose network, and
    # nothing outside this host should reach it at all.
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  parkscomputing:
    image: parkscomputing-local:dev
    container_name: parkscomputing-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AUTH_CONNECTION_STRING=Server=sqlserver,1433;Database=ParksComputingAuth;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true;Encrypt=false;
      # Admin sign-in (Architecture/admin-and-identity-design.md): the edit
      # origin, and mail through Resend for sign-in links and notices.
      - Admin__EditOrigin=https://edit.parkscomputing.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO}
    # Loopback only: the public reaches the site through the cloudflared
    # tunnel on this host, so a request can never go around Cloudflare
    # (and around Cloudflare Access on edit.parkscomputing.com).
    ports:
      - "127.0.0.1:80:8080"
    # The web root is writable, for the admin mount on the edit origin; the
    # admins' home directories, the edit origin's shared configuration (/etc)
    # and the history of changed files sit beside it, outside what the site
    # serves (Architecture/admin-and-identity-design.md, A7, A10 and A15).
    # The server's own configuration, the SSH destinations among it (A16),
    # is read-only and outside the admin mount, so nothing done through the
    # site can change it.
    volumes:
      - C:\Users\paul\OneDrive\Documents\parkscomputing.com\wwwroot:/app/wwwroot
      - C:\Users\paul\OneDrive\Documents\parkscomputing.com\home:/app/home
      - C:\Users\paul\OneDrive\Documents\parkscomputing.com\etc:/app/etc
      - C:\Users\paul\OneDrive\Documents\parkscomputing.com\history:/app/history
      - C:\Users\paul\OneDrive\Documents\parkscomputing.com\config:/app/config:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  padmajairam:
    image: padmajairam-local:dev
    container_name: padmajairam-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AUTH_CONNECTION_STRING=Server=sqlserver,1433;Database=PadmaJairamSite;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true;Encrypt=false;
      - JWT_SECRET=${JWT_SECRET_PADMAJAIRAM}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - C:\Users\paul\OneDrive\Documents\padmajairam.com\wwwroot:/app/wwwroot:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sqlserver-data:
    external: true
